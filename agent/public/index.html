<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Agent Playground</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .container {
      max-width: 640px;
      width: 100%;
    }
    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #6e6e73;
      font-size: 15px;
      margin-bottom: 32px;
    }
    .config-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .config-bar input, .config-bar select {
      padding: 10px 14px;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
    }
    .config-bar input { flex: 1; min-width: 120px; }
    .config-bar select { width: 120px; }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
    }
    button {
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-start {
      background: #0071e3;
      color: #fff;
    }
    .btn-start:hover:not(:disabled) { background: #0077ed; }
    .btn-stop {
      background: #ff3b30;
      color: #fff;
    }
    .btn-stop:hover:not(:disabled) { background: #ff453a; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      background: #e8e8ed;
      color: #6e6e73;
    }
    .status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8e8e93;
    }
    .status.listening .dot { background: #34c759; }
    .status.listening { background: #d1f4d8; color: #1a7a3a; }
    .status.thinking .dot { background: #ff9500; }
    .status.thinking { background: #fff3d6; color: #8a5a00; }
    .status.speaking .dot { background: #0071e3; }
    .status.speaking { background: #d0e8ff; color: #004cb3; }
    .transcript-box {
      background: #fff;
      border: 1px solid #d2d2d7;
      border-radius: 16px;
      padding: 24px;
      min-height: 300px;
      max-height: 400px;
      overflow-y: auto;
    }
    .message {
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .message:last-child { margin-bottom: 0; }
    .message .role {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: #6e6e73;
      margin-bottom: 4px;
    }
    .message.user .role { color: #34c759; }
    .message.agent .role { color: #0071e3; }
    .message .text { font-size: 15px; }
    .message .text.partial { color: #8e8e93; font-style: italic; }
    .outcome {
      margin-top: 16px;
      padding: 16px;
      border-radius: 12px;
      font-weight: 600;
      text-align: center;
    }
    .outcome.CONFIRMED { background: #d1f4d8; color: #1a7a3a; }
    .outcome.DENIED { background: #ffe6e6; color: #c0392b; }
    .outcome.ESCALATED { background: #fff3d6; color: #8a5a00; }
    .outcome.NO_ANSWER { background: #e8e8ed; color: #6e6e73; }
    .error {
      margin-top: 16px;
      padding: 12px 16px;
      background: #ffe6e6;
      color: #c0392b;
      border-radius: 12px;
      font-size: 14px;
    }
    .hint {
      margin-top: 16px;
      font-size: 13px;
      color: #8e8e93;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Voice Agent Playground</h1>
    <p class="subtitle">Talk to the medication adherence agent in your browser. No phone call needed.</p>

    <div class="config-bar">
      <input type="text" id="parentName" placeholder="Parent name" value="रोहन">
      <input type="text" id="drugName" placeholder="Drug name" value="Crocin">
      <select id="language">
        <option value="hi">हिन्दी (Hindi)</option>
        <option value="en">English</option>
      </select>
    </div>

    <div class="controls">
      <button class="btn-start" id="startBtn">Start Conversation</button>
      <button class="btn-stop" id="stopBtn" disabled>Stop</button>
      <div class="status" id="status">
        <span class="dot"></span>
        <span id="statusText">Idle</span>
      </div>
    </div>

    <div class="transcript-box" id="transcript">
      <div class="hint">Click "Start Conversation" to begin. The agent will greet you first.</div>
    </div>

    <div id="errorBox"></div>
    <div id="outcomeBox"></div>

    <p class="hint">
      Uses Sarvam AI directly — no Vapi or Twilio costs.<br>
      Allow microphone access when prompted.
    </p>
  </div>

  <script src="/vad.js"></script>
  <script src="/playground.js"></script>
</body>
</html>
