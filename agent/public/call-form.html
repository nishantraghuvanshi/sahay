<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Call a Parent — Voice Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .container {
      max-width: 560px;
      width: 100%;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 24px;
      color: #0071e3;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    .back-link:hover { text-decoration: underline; }
    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #6e6e73;
      font-size: 15px;
      margin-bottom: 32px;
    }
    .call-form {
      background: #fff;
      border: 1px solid #d2d2d7;
      border-radius: 16px;
      padding: 28px 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group:last-of-type {
      margin-bottom: 24px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #1d1d1f;
      margin-bottom: 6px;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
      color: #1d1d1f;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #0071e3;
    }
    .form-group input::placeholder {
      color: #aeaeb2;
    }
    .helper-text {
      display: block;
      margin-top: 6px;
      font-size: 12px;
      color: #8e8e93;
    }
    button {
      width: 100%;
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-call {
      background: #0071e3;
      color: #fff;
    }
    .btn-call:hover:not(:disabled) { background: #0077ed; }
    .status-area {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      background: #e8e8ed;
      color: #6e6e73;
      align-self: flex-start;
    }
    .status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8e8e93;
    }
    .status.calling .dot { background: #ff9500; }
    .status.calling { background: #fff3d6; color: #8a5a00; }
    .status.connected .dot { background: #0071e3; }
    .status.connected { background: #d0e8ff; color: #004cb3; }
    .status.ended .dot { background: #34c759; }
    .status.ended { background: #d1f4d8; color: #1a7a3a; }
    .status.error .dot { background: #ff3b30; }
    .status.error { background: #ffe6e6; color: #c0392b; }
    .call-id {
      font-size: 12px;
      color: #8e8e93;
      font-family: 'SF Mono', SFMono-Regular, Menlo, monospace;
      word-break: break-all;
    }
    .outcome {
      margin-top: 4px;
      padding: 16px;
      border-radius: 12px;
      font-weight: 600;
      text-align: center;
    }
    .outcome.CONFIRMED { background: #d1f4d8; color: #1a7a3a; }
    .outcome.DENIED { background: #ffe6e6; color: #c0392b; }
    .outcome.ESCALATED { background: #fff3d6; color: #8a5a00; }
    .outcome.NO_ANSWER { background: #e8e8ed; color: #6e6e73; }
    .error {
      margin-top: 4px;
      padding: 12px 16px;
      background: #ffe6e6;
      color: #c0392b;
      border-radius: 12px;
      font-size: 14px;
    }
    .hint {
      margin-top: 24px;
      font-size: 13px;
      color: #8e8e93;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/playground" class="back-link">&larr; Back to Playground</a>

    <h1>Call a Parent</h1>
    <p class="subtitle">Enter the details below and the voice agent will call immediately.</p>

    <form class="call-form" id="callForm">
      <div class="form-group">
        <label for="parentName">Parent name</label>
        <input type="text" id="parentName" name="parentName" placeholder="e.g., रोहन" value="रोहन" autocomplete="name">
      </div>

      <div class="form-group">
        <label for="phoneNumber">Phone number</label>
        <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="+91XXXXXXXXXX" required autocomplete="tel">
        <span class="helper-text">E.164 format: country code + number</span>
      </div>

      <div class="form-group">
        <label for="drugName">Drug name</label>
        <input type="text" id="drugName" name="drugName" placeholder="e.g., Crocin" value="Crocin">
      </div>

      <div class="form-group">
        <label for="language">Language</label>
        <select id="language" name="language">
          <option value="hi">हिन्दी (Hindi)</option>
          <option value="en">English</option>
        </select>
      </div>

      <button type="submit" class="btn-call" id="callBtn">Call Now</button>
    </form>

    <div class="status-area">
      <div class="status" id="statusPill">
        <span class="dot"></span>
        <span id="statusText">Ready</span>
      </div>
      <div class="call-id" id="callIdDisplay"></div>
      <div id="outcomeBox"></div>
      <div id="errorBox"></div>
    </div>

    <p class="hint">
      The agent calls the number and confirms medication adherence.<br>
      Outcomes appear here after the call ends.
    </p>
  </div>

  <script src="/call-form.js"></script>
</body>
</html>
